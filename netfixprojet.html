<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>netflix project</title>
    <style>
        * {
            padding: 0px;
            margin: 0px;
        }

        .navbar {
            /* background-color:brown; */
            width: 100%;
            height: 70px;
            display: flex;
            /* padding: 20px ; */
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0px;
            left: 0px;
           background: linear-gradient(to right, black, rgb(37, 7, 7));
           z-index: 1000;


        }

        .langue {
            background-color: black;
            color: white;
            border-radius: 20px;
            width: 90px;
            height: 30px;
            border: solid 2px;
            margin-right: 10px;

            float: left;


        }

        .sign {
            background-color: red;
            border: solid 2px;
            border-radius: 20px;
            width: 90px;
            height: 30px;
            border-color: white;


        }

        .navbutton {
            margin-right: 50px;

        }

        .netflix {
            width: 150px;
            height: 100px;
            margin-left: 30px;




        }
        .netflix img{
            width: 100px;

            height: 100px;
            object-fit: contain;
            
        }

        .img {
            border: solid 5px;
            border-radius: 20px;
             margin-left:60px;
            margin-right: 10px;
            width: 90%;
            height: 400px;
            border-color: white;
            position: relative;
            /* margin: 90px auto 0;
            box-sizing: border-box;
 */

        }

        .img img {
            width: 100%;
            height: 100%;
            display: block;
            opacity: 0.8;
            object-fit: cover;
            border-radius: 15px;
            position: relative;
            object-fit: cover;

        }

        .back {
            background: linear-gradient(black, rgb(51, 13, 13));
            height: 1000px;
            margin-top: 70px;





        }

        .text {
            position: absolute;
            top: 30%;
            left: 50%;
            text-align: center;
            color: white;
            transform: translate(-50%, -50%);
            font-family: "times new roman";
            text-shadow: 2px 2px 6px;
            width: 90%;
            font-weight: bold;
        }

        .text h1 {
            font-size: 48px;
            margin-top: 30px;

        }

        .text h2 {
            font-size: 40px;
            margin-top: 40px;
        }

        .text p {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .cards {
            display: flex;
            justify-content: center;
            position: relative;
            gap: 40px;
            margin-top: -120px;

        }

        .card {
            width: 230px;
            height: 300px;
            border: solid 3px white;
            position: relative;
            overflow: hidden;
            border-radius: 20px;

        }

        .card img {
            width: 100%;
            height: 100%;

            object-fit: cover;
            display: block;
        }

        .last {

            margin-top: 50px;
            margin-left: 500px;
            display: flex;
            gap: 10px;
        }

        .last input {
            background-color: black;
            border-radius: 20px;
            color: white;
            width: 200px;
            height: 40px;
            border-color: white;
            font-weight: bold;
            text-align: center;
             
            justify-content: center;       

        }

        .last button {
            width: 150px;
            height: 40px;
            color: white;
            background-color: red;
            border-radius: 20px;
            border-color: white;
            border: solid 3px;
            
            
        }

        .card:hover {
            transform: scale(1.08) translateY(-10px);
        }
        body{
            overflow: auto;
        }
    </style>
</head>

<body>
    <!-- <div class="back"> -->


    <nav class="navbar">
        <div class="netflix"><img src="netfliximg.png"></div>
        <div class="navbutton">
            <select class="langue">
                <option value="tamil">Tamil</option>
                <option value="english">English</option>
            </select>
            <button class="sign">Sign in</button>
        </div>

    </nav>

    <div class="back">



        <div class="img"> <img src="netflix image.jpeg">
            <div class="text">
                <h1>Endless entertainment start here</h1>
                <h2> plans from ₹149.</h2>
                <p>cancol or switch plans at anytime</p>
            </div>

        </div>
        <section class="cards">
            <div class="card"><img src="ranaimage.jpg"></div>
            <div class="card"><img src="meralimage.jpg"></div>
            <div class="card"><img src="testimage.jpg"></div>
            <div class="card"> <img src="yasimage.webp"></div>
        </section>
        <div class="last">
            <div><input type="email" placeholder="Enter mail here"></div>
            <div><button value="sign in">Sign in</button></div>
        </div>


    </div>

</body>

</html>
